version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Dev@12345
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ./database:/var/opt/mssql
      - ./database/init:/scripts/init
      - ./database/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "-c", "/entrypoint.sh & /opt/mssql/bin/sqlservr"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Dev@12345", "-Q", "SELECT 1"]
      interval: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-data:
    driver: local