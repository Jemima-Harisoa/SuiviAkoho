<div class="race-list-container" >
  <h2>
    Liste des races
  </h2>

  <div *ngIf="loading" class="loading" >
    Chargement en cours...
  </div>

  <div *ngIf="error" class="error" >
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && races.length === 0">
    Aucune race disponible.
  </div>

  <table *ngIf="!loading && races.length > 0" >
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom </th>
        <th>Date de creation</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let race of races" >
        <td>{{ race.raceId  }}</td>
        <td>{{ race.name  }}</td>
        <td>{{ race.createdAt  | date:'short'  }}</td>
      </tr>
    </tbody>
  </table>

</div>
