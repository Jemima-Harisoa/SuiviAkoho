<div class="race-form-container">
  <h2>Ajouter une Race</h2>

  <div *ngIf="message" [class]="'message ' + messageType">
    {{ message }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="race-form">
    <!-- Nom de la race -->
    <div class="form-group">
      <label for="name">Nom de la race *</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ex: Poule Sussex"
        class="form-input"
      />
      <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="error-text">
        <span *ngIf="form.get('name')?.errors?.['required']">Le nom est requis</span>
        <span *ngIf="form.get('name')?.errors?.['minlength']">Le nom doit avoir au moins 3 caractères</span>
      </div>
    </div>

    <!-- Propriétés dynamiques -->
    <div class="form-group">
      <label>Description (propriétés) <span class="optional">(optionnel)</span></label>

      <div formArrayName="properties" class="properties-list">
        <div *ngFor="let property of properties.controls; let i = index" class="property-row">
          <div [formGroupName]="i" class="property-inputs">
            <input
              type="text"
              formControlName="key"
              placeholder="Clé (ex: couleur)"
              class="form-input"
            />
            <input
              type="text"
              formControlName="value"
              placeholder="Valeur (ex: noir)"
              class="form-input"
            />
            <button
              type="button"
              (click)="removeProperty(i)"
              class="btn btn-danger"
              title="Supprimer cette propriété"
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <button
        type="button"
        (click)="addProperty()"
        class="btn btn-secondary"
      >
        + Ajouter une propriété
      </button>
    </div>

    <!-- Boutons d'action -->
    <div class="form-actions">
      <button type="submit" [disabled]="!form.valid || loading" class="btn btn-primary">
        {{ loading ? 'Création en cours...' : 'Créer la race' }}
      </button>
      <button type="button" (click)="resetForm()" class="btn btn-secondary">
        Réinitialiser
      </button>
    </div>
  </form>
</div>
